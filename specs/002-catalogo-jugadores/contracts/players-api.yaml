openapi: 3.0.3
info:
  title: API de catálogo de jugadores
  version: 1.0.0
  description: Contrato de Entrega 1 para consultar el catálogo local de jugadores.
paths:
  /players:
    get:
      summary: Lista jugadores paginados
      parameters:
        - $ref: '#/components/parameters/League'
        - $ref: '#/components/parameters/Team'
        - $ref: '#/components/parameters/Position'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de jugadores; puede estar vacía para filtros admitidos sin coincidencias o página fuera de rango.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /players/{id}:
    get:
      summary: Obtiene el detalle de un jugador
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Jugador encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No existe un jugador con ese identificador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  parameters:
    League:
      name: league
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/League'
    Team:
      name: team
      in: query
      required: false
      description: Nombre de equipo; se interpreta como un criterio de coincidencia exacta tras normalización de espacios.
      schema:
        type: string
        minLength: 1
    Position:
      name: position
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Position'
    Page:
      name: page
      in: query
      required: false
      description: Índice base cero. Por defecto, 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Cantidad de resultados por página. Por defecto, 10; máximo, 50.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
  responses:
    BadRequest:
      description: Parámetro de consulta o identificador con formato/valor inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    League:
      type: string
      enum: [PREMIER, BUNDESLIGA, LA_LIGA, SERIE_A, LIGUE_1]
    Position:
      type: string
      enum: [GOALKEEPER, DEFENDER, MIDFIELDER, FORWARD]
    PlayerResponse:
      type: object
      required: [id, name, position, team, league]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        position:
          $ref: '#/components/schemas/Position'
        team:
          type: string
        league:
          $ref: '#/components/schemas/League'
    PlayerPageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages, hasPrevious, hasNext]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PlayerResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasPrevious:
          type: boolean
        hasNext:
          type: boolean
    ApiError:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
          description: Mensaje claro en español, sin detalles internos.
        path:
          type: string
        violations:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
              rejectedValue:
                type: string
