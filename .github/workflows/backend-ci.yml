name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Si se pushea dos veces seguidas, se cancela la corrida vieja.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (H2 en memoria)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Build + tests
        run: ./gradlew build --no-daemon

      - name: Publicar reporte de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          retention-days: 7

  sonar:
    name: SonarCloud
    # El plan Free de SonarQube Cloud solo analiza la rama principal del proyecto.
    # Por eso este job corre unicamente en los push a main; en develop y en los PR
    # el scanner rechazaria el analisis de rama.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Sonar necesita el historial completo para el blame y el fechado de issues.
          fetch-depth: 0

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Tests + cobertura + analisis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew test jacocoTestReport sonar --no-daemon
