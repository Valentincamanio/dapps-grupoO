spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # create y no create-drop: varios contextos de test comparten testdb, y cerrar uno (Spring
      # desaloja los viejos de su caché) no tiene que borrar las tablas que otro todavía usa
      ddl-auto: create
  h2:
    console:
      enabled: false

