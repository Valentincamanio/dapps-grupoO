spring:
  application:
    name: futbol-market
  profiles:
    default: local
  jpa:
    open-in-view: false
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

futbolmarket:
  auth:
    initial-balance: 1000.00
  security:
    jwt:
      expiration: 24h
