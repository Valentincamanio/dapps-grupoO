spring:
  application:
    name: futbol-market
  profiles:
    default: local
  jpa:
    open-in-view: false
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

futbolmarket:
  auth:
    initial-balance: 1000.00
  security:
    jwt:
      expiration: 24h
  football-data:
    token: ${FOOTBALL_DATA_TOKEN:}
    base-url: https://api.football-data.org/v4
    connect-timeout: 10s
    read-timeout: 30s
    sync:
      cron: "0 0 4 * * MON"
      zone: America/Argentina/Buenos_Aires
      on-startup: true
