plugins {
	id 'java'
	id 'jacoco'
	id 'org.sonarqube' version '7.5.0.8588'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ar.edu.unq.desapp'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStackTraces = true
    }
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

sonar {
    properties {
        property 'sonar.projectKey', 'Valentincamanio_dapps-grupoO'
        property 'sonar.organization', 'valentincamanio'
        property 'sonar.host.url', 'https://sonarcloud.io'
        // Falsos positivos revisados, ignorados acá para que la decisión quede versionada.
        // e1 y e2: java:S2068 toma por contraseñas los mensajes de error cuyo nombre dice PASSWORD.
        // e3: java:S4502 marca el CSRF deshabilitado, pero la API no usa sesión ni cookies (la
        // credencial viaja en un header) y la consola de H2 solo existe en el perfil local.
        property 'sonar.issue.ignore.multicriteria', 'e1,e2,e3'
        property 'sonar.issue.ignore.multicriteria.e1.ruleKey', 'java:S2068'
        property 'sonar.issue.ignore.multicriteria.e1.resourceKey', '**/modelo/auth/CredentialPolicy.java'
        property 'sonar.issue.ignore.multicriteria.e2.ruleKey', 'java:S2068'
        property 'sonar.issue.ignore.multicriteria.e2.resourceKey', '**/modelo/user/AppUser.java'
        property 'sonar.issue.ignore.multicriteria.e3.ruleKey', 'java:S4502'
        property 'sonar.issue.ignore.multicriteria.e3.resourceKey', '**/security/SecurityConfig.java'
    }
}

tasks.register('exportStatsSnapshot', JavaExec) {
    group = 'application'
    description = 'Exporta el snapshot de estadísticas de WhoScored desde la base local, sin servidor web ni sincronizaciones.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ar.edu.unq.desapp.futbolmarket.StatsSnapshotExport'
    workingDir = projectDir
}
